services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: talentmatch-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./api:/var/www/html
      - api_storage:/var/www/html/storage
    networks:
      - talentmatch_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: TalentMatch
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3Q=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-talentmatch}
      DB_USERNAME: ${DB_USERNAME:-talentmatch}
      DB_PASSWORD: ${DB_PASSWORD:-talentmatch_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      JOBSOURCE_DRIVER: ${JOBSOURCE_DRIVER:-mock}
      JOBSOURCE_BASE_URL: ${JOBSOURCE_BASE_URL:-http://mock-jobsource:4000}
      AI_DRIVER: mock
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:3000}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-localhost}
    ports:
      - "${API_PORT:-8080}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: talentmatch-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    networks:
      - talentmatch_net
    depends_on:
      - api
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:8080/api}
      NUXT_API_INTERNAL: http://api:8000/api
      NODE_ENV: development
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  db:
    image: pgvector/pgvector:pg16
    container_name: talentmatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-talentmatch}
      POSTGRES_USER: ${DB_USERNAME:-talentmatch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-talentmatch_secret}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - talentmatch_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-talentmatch}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${DB_PORT:-5433}:5432"

  redis:
    image: redis:7-alpine
    container_name: talentmatch-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - talentmatch_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mock-jobsource:
    build:
      context: ./mock-jobsource
      dockerfile: Dockerfile
    container_name: talentmatch-mock-jobsource
    restart: unless-stopped
    networks:
      - talentmatch_net
    volumes:
      - ./mock-jobsource/data:/app/data
    environment:
      PORT: 4000
      NODE_ENV: production
    ports:
      - "${MOCK_PORT:-4000}:4000"

networks:
  talentmatch_net:
    driver: bridge

volumes:
  db_data:
  redis_data:
  api_storage:
  node_modules: