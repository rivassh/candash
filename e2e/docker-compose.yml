# E2E smoke suite for candash - runs entirely inside Docker
# Run: docker compose -f e2e/docker-compose.yml up --build --abort-on-container-exit
services:
  mock-api:
    build:
      context: .
      dockerfile: Dockerfile.mock
      args:
        - NODE_ENV=production
    container_name: candash-e2e-mock-api
    restart: "no"
    networks:
      - sail
      - candash_default
    environment:
      PORT: "8086"
    ports:
      - "8086:8086"
    command: ["npm", "run", "mock"]

  e2e:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: candash-e2e
    restart: "no"
    networks:
      - sail
      - candash_default
    depends_on:
      - mock-api
    environment:
      CANDASH_API: "http://candash-api-1:8000"
      MOCK_API_URL: http://mock-api:8086
    volumes:
      - ./features:/tests/features
      - ./step_definitions:/tests/step_definitions
      - ./support:/tests/support
      - ./reports:/tests/reports
      - /root/.cache/ms-playwright:/root/.cache/ms-playwright

networks:
  sail:
    external: true
  candash_default:
    external: true
